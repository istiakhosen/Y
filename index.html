<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering BSc Admission Document</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f4f5f7;
        color: #182033;
    }
    header {
        background: #111827;
        color: white;
        text-align: center;
        padding: 28px 16px;
    }
    h1 {
        margin: 0;
        font-size: clamp(25px, 6vw, 42px);
    }
    .subtitle {
        margin: 10px 0 0;
        opacity: .85;
        font-size: 18px;
    }
    main {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 18px;
    }
    .card {
        background: white;
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h2 {
        margin-top: 0;
        font-size: 28px;
    }
    .meta {
        color: #6b7280;
        margin-bottom: 22px;
        line-height: 1.5;
    }
    .viewer {
        width: 100%;
        height: 75vh;
        min-height: 550px;
        border: 1px solid #d1d5db;
        border-radius: 16px;
        overflow: hidden;
        background: #eee;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }
    .notice {
        margin-top: 15px;
        padding: 12px 15px;
        background: #f3f4f6;
        border-radius: 10px;
        color: #6b7280;
        font-size: 14px;
    }
    @media (max-width: 600px) {
        main { margin: 20px auto; padding: 0 12px; }
        .card { padding: 18px; border-radius: 18px; }
        .viewer { height: 72vh; min-height: 500px; }
        h2 { font-size: 24px; }
    }
</style>
</head>

<body oncontextmenu="return false">

<header>
    <h1>Engineering BSc Admission Document</h1>
    <div class="subtitle">Document Viewer</div>
</header>

<main>
    <section class="card">
        <h2>Politecnico di Milano</h2>

        <div class="meta">
            Engineering Bachelor Degree Programmes · Academic Year 2026/2027
        </div>

        <div class="viewer">
            <iframe
                src="Engineering_BSc_Call_for_Admission_2026-27.pdf#toolbar=0&navpanes=0&scrollbar=1"
                title="Engineering BSc Admission Document">
            </iframe>
        </div>

        <div class="notice">
            This document is provided for viewing purposes only.
        </div>
    </section>
</main>

<script>
document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey && ["s", "p", "u"].includes(e.key.toLowerCase())) ||
        e.key === "F12"
    ) {
        e.preventDefault();
    }
});
</script>

</body>
</html>
