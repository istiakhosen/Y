<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Engineering BSc Admission Document</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0 0 7px;font-size:24px}
header p{margin:0;opacity:.8;font-size:14px}
main{max-width:1100px;margin:24px auto;padding:0 14px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.title{font-size:19px;font-weight:700;margin-bottom:6px}
.meta{color:#6b7280;font-size:13px;margin-bottom:16px}
.viewer{width:100%;height:78vh;min-height:520px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden;background:#e5e7eb}
iframe{width:100%;height:100%;border:0}
.notice{margin-top:12px;font-size:12px;color:#6b7280;text-align:center}
@media(max-width:600px){header h1{font-size:19px}.card{padding:12px}.viewer{height:72vh;min-height:430px}}
</style>
</head>
<body oncontextmenu="return false">
<header>
<h1>Engineering BSc Admission Document</h1>
<p>Document Viewer</p>
</header>
<main>
<section class="card">
<div class="title">Politecnico di Milano</div>
<div class="meta">Engineering Bachelor Degree Programmes · Academic Year 2026/2027</div>
<div class="viewer">
<iframe src="pdf/Engineering_BSc_Call_for_Admission_2026-27.pdf#toolbar=0&navpanes=0&scrollbar=1" title="PDF Viewer"></iframe>
</div>
<div class="notice">This document is provided for viewing purposes only.</div>
</section>
</main>
<script>
document.addEventListener("keydown",function(e){
 if((e.ctrlKey&&["s","p","u"].includes(e.key.toLowerCase()))||e.key==="F12"){
  e.preventDefault();e.stopPropagation();
 }
},true);
document.addEventListener("contextmenu",function(e){e.preventDefault()},true);
</script>
</body>
</html>
